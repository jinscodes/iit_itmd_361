<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Volunteer Form</h1>
    <form
      action="http://bloomingdale.sat.iit.edu/kriedan/lab3formscript.php"
      method="post"
    >
      <input type="hidden" name="hidden_field" value="Jay Han(Jinsung Han)" />
      <fieldset>
        <legend>My Info</legend>

        <div class="row">
          <label for="first_name_field">first name:</label>
          <input
            id="first_name_field"
            name="first_name_field"
            type="text"
            autocomplete="given-name"
            required
          />
        </div>
        <div class="row">
          <label for="last_name_field">last name:</label>
          <input
            id="last_name_field"
            name="last_name_field"
            type="text"
            autocomplete="family-name"
            required
          />
        </div>
        <div class="row">
          <label for="phone_field">phone:</label>
          <input
            id="phone_field"
            name="phone_field"
            type="tel"
            placeholder="(630) 333-7777"
          />
        </div>
        <div class="row">
          <label for="email_field">email:</label>
          <input
            id="email_field"
            name="email_field"
            type="email"
            placeholder="hello@world"
          />
        </div>
        <div class="row">
          <span>Gender:</span>
          <div>
            <label class="inline">
              <input type="radio" name="gender_field" value="male" /> Male
            </label>
            <label class="inline">
              <input type="radio" name="gender_field" value="female" /> Female
            </label>
          </div>
        </div>
        <div class="row">
          <label for="age_field">Age:</label>
          <select id="age_field" name="age_field">
            <option value="under 18">under 18</option>
            <option value="over 18">over 18</option>
          </select>
        </div>
      </fieldset>
      <fieldset>
        <legend>My Availability</legend>
        <div style="align-items: start">
          <label>Days Available:</label>
          <div>
            <label class="inline">
              <input type="checkbox" name="available_field[]" value="sunday" />
              Sunday
            </label>
            <label class="inline">
              <input type="checkbox" name="available_field[]" value="monday" />
              Monday
            </label>
            <label class="inline">
              <input type="checkbox" name="available_field[]" value="tuesday" />
              Tuesday
            </label>
            <label class="inline">
              <input
                type="checkbox"
                name="available_field[]"
                value="wednesday"
              />
              Wednesday
            </label>
            <label class="inline">
              <input
                type="checkbox"
                name="available_field[]"
                value="thursday"
              />
              Thursday
            </label>
            <label class="inline">
              <input type="checkbox" name="available_field[]" value="friday" />
              Friday
            </label>
            <label class="inline">
              <input
                type="checkbox"
                name="available_field[]"
                value="saturday"
              />
              Saturday
            </label>
          </div>
        </div>
        <div class="row" style="align-items: start">
          <label for="comments_field">Comments</label>
          <textarea
            id="comments_field"
            name="comments_field"
            placeholder="Any additional information..."
          ></textarea>
        </div>
      </fieldset>
      <button type="submit">Submit Query</button>
    </form>
  </body>
</html>
